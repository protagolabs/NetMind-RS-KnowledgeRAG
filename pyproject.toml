[project]
name = "netmind-rs-knowledgerag"
version = "0.1.0"
description = "NetMind Research KnowledgeRAG API Server"
readme = "README.md"
requires-python = ">=3.12.1"
dependencies = [
    # Web Framework
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    # Data Validation and Serialization
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    # Logging
    "loguru>=0.7.3",
    # Configuration Management
    "python-dotenv>=1.1.1",
    # Database Connectors
    "mysql-connector-python>=9.3.0",
    "pymilvus>=2.5.12",
    "sqlalchemy>=2.0.42",
    # Scientific Computing
    "numpy>=2.3.1",
    "pandas>=2.3.1",
    # HTTP Client
    "httpx==0.27.2",
    # AI and ML Libraries
    "openai>=1.97.1",
    "openai-agents>=0.2.5",
    "sentence-transformers>=2.2.0",
    # Text Processing
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-community>=0.3.27",
    "langchain-text-splitters>=0.3.9",
    # File and Data Processing
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.20",
    "tqdm>=4.67.1",
    "traceloop-sdk>=0.44.1",
    "httpcore==1.0.5",
    "tiktoken>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
