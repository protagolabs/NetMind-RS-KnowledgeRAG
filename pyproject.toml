[project]
name = "netmind-rs-knowledgerag"
version = "0.1.0"
description = "NetMind Research KnowledgeRAG API Server"
readme = "README.md"
requires-python = ">=3.8.1"
dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Data Validation and Serialization
    "pydantic>=2.5.0",
    
    # Logging
    "loguru>=0.7.2",
    
    # Configuration Management
    "python-dotenv>=1.0.0",
    
    # Database Connectors
    "mysql-connector-python>=8.2.0",
    "pymilvus>=2.3.0",
    
    # Scientific Computing
    "numpy>=1.24.0",
    
    # HTTP Client
    "httpx>=0.25.0",
    
    # Additional dependencies
    "sentence-transformers>=2.2.0",
    "openai>=1.3.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
